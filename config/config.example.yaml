# Copy to config/config.yaml and edit. Only target.wan_host is required.

target:
  # His public IP or a DDNS hostname that points at it.
  wan_host: friend.example.com
  # Optional TCP ports on his WAN to probe in addition to ping (only if something
  # answers there; the WireGuard port is UDP and silent, so it can't be probed).
  tcp_ports: []
  # His WAN's default gateway: the ISP's router his connection plugs into. It's
  # pinged from the internet and through the tunnel. "auto" takes it from the
  # UniFi API, or from a traceroute through his router if UniFi isn't set up.
  isp_gateway: auto
  # The last router before his WAN on a traceroute from the monitor. Often a
  # different interface of the same ISP router, sometimes the next one up.
  isp_hop_external: auto

# Hosts pinged from the monitor's own connection. If these fail too, an outage
# window is marked inconclusive rather than blamed on anyone.
control_targets: [1.1.1.1, 8.8.8.8]

# Times are stored in UTC and only converted for display (dashboard and report).
# Empty uses the container's TZ setting from the compose file.
display_timezone: ""        # e.g. America/Chicago

interval_seconds: 15   # how often each check runs
fail_threshold: 2      # consecutive failures before an incident opens
retention_days: 90

wireguard:
  enabled: true
  config: /config/wg0.conf     # the client config exported from his UniFi WireGuard server
  gateway_lan_ip: 192.168.1.1  # his Dream Router's LAN IP
  internet_targets: [1.1.1.1, 8.8.8.8]
  dns_servers: [1.1.1.1]
  dns_query: www.google.com
  gateway_dns: true           # also test DNS through his gateway's resolver
  http_url: https://www.google.com/generate_204

unifi:
  enabled: true
  url: https://192.168.1.1     # reached through the tunnel
  api_key: ${UNIFI_API_KEY}    # UniFi Network → Settings → Control Plane → Integrations
  # Or a local (non-SSO) admin account instead of an API key:
  username: ""
  password: ""
  site: default
  verify_tls: false            # the gateway uses a self-signed certificate
  interval_seconds: 30         # also how often load (throughput, CPU, clients) is sampled
  # His plan's speeds, to show load as a share of the line. 0 = use UniFi's last
  # speed test result, if it has one.
  wan_down_mbps: 0
  wan_up_mbps: 0

# Push notifications through ntfy (ntfy.sh or your own server). You get one message
# when an outage starts and one when it ends, with the verdict.
ntfy:
  enabled: false
  server: https://ntfy.sh      # or your self-hosted server, e.g. https://ntfy.example.com
  topic: pickle-change-me      # on ntfy.sh, anyone who knows the topic can read it: make it unguessable
  # Only for servers that require login. Use an access token (ntfy token add <user>),
  # or a username and password; the token wins if both are set. These can also come
  # from the NTFY_TOKEN / NTFY_USERNAME / NTFY_PASSWORD environment variables.
  token: ""
  username: ""
  password: ""
  verify_tls: true             # false for a self-hosted server with a self-signed certificate
  min_duration_seconds: 60     # ignore outages shorter than this
  priority_down: high          # min | low | default | high | max
  priority_up: default
  ignore_verdicts: []          # e.g. [tunnel, monitor] to skip VPN-only and monitor-side outages
  click_url: ""                # opened when you tap the notification, e.g. http://docker-host:8080
  # The "outage started" message ends with an on-site checklist (photograph the ONT, ping
  # the ISP gateway and check `ip neigh` on the router, then re-plug only the WAN cable).
  # {isp_gateway} becomes his WAN's default gateway. Uncomment to change it, or set it to
  # "" to leave it out.
  # onsite_note: |
  #   On site, before touching anything:
  #   1. Photograph the ONT (Network Status light, ETH1 lights).
  #   2. ...

# Optional: read the router's DHCP/WAN log over SSH (through the tunnel), so outages
# show what the router's DHCP client did. Off by default; see "Router log over SSH" in
# the README for the security tradeoff.
ssh:
  enabled: false
  # host: 192.168.1.1          # default: wireguard.gateway_lan_ip
  port: 22
  username: root
  password: ""                 # or set SSH_PASSWORD in the compose file
  key_file: ""                 # or a private key, e.g. /config/router_ed25519
  host_key: ""                 # empty = pin the router's key on first connect

# Extra checks (same shape as the built-in ones). via: external | vpn,
# type: ping | tcp | dns | http, role: see app/pickle_wan/config.py.
extra_checks: []
#  - id: vpn_nas
#    name: His NAS
