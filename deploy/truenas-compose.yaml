# TrueNAS SCALE: Apps -> Discover Apps -> ⋮ -> Install via YAML, then paste this.
#
# Before installing, create these datasets/folders (adjust the pool path) and put
# two files in the config folder:
#   /mnt/tank/apps/pickle/config/config.yaml   (from config/config.example.yaml)
#   /mnt/tank/apps/pickle/config/wg0.conf      (WireGuard client config from his UniFi)
#   /mnt/tank/apps/pickle/data/                (empty; the database lives here)
#
# The container keeps two paths apart: "external" checks use TrueNAS's normal
# internet connection, and only the "through his router" checks use the WireGuard
# tunnel, which lives inside the container. TrueNAS's own routing is untouched.
services:
  pickle:
    image: ghcr.io/ajthom90/pickle:latest
    container_name: pickle
    restart: unless-stopped
    cap_add:
      - NET_ADMIN   # create wg0 and its routing rule inside the container
      - NET_RAW     # ping / traceroute
    sysctls:
      net.ipv4.conf.all.rp_filter: 2
    ports:
      - "8080:8080"
    volumes:
      - /mnt/tank/apps/pickle/config:/config:ro
      - /mnt/tank/apps/pickle/data:/data
    environment:
      TZ: America/Chicago
      UNIFI_API_KEY: "paste-your-unifi-api-key-here"
      # ntfy credentials, if your ntfy server requires login (or set them in config.yaml):
      # NTFY_TOKEN: "tk_..."
      # NTFY_USERNAME: pickle
      # NTFY_PASSWORD: change-me
      # Uncomment to require a login for the web UI:
      # PICKLE_USERNAME: admin
      # PICKLE_PASSWORD: change-me
